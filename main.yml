name: Build RK KANCELARIA Windows Portable

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

# Pozwala automatycznie zapisać poprawiony app.py na main/master po testach.
# Jeżeli regulamin repozytorium blokuje automatyczny push, build dalej działa.
permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4

      - name: Python 3.13 x64
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: 'x64'
          cache: 'pip'

      - name: Aktualizuj pip
        shell: pwsh
        run: python -m pip install --upgrade pip wheel setuptools

      - name: Zainstaluj zaleznosci RK KANCELARIA
        shell: pwsh
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -r requirements_desktop.txt
          python -m pip install "pyinstaller>=6.10,<7"

      - name: Zastosuj aktualizacje Skrzynka wplywu
        shell: pwsh
        run: |
          python AKTUALIZUJ_KOD.py .

      - name: Test zrodel przed buildem
        shell: pwsh
        run: |
          python -m py_compile app.py rk_inbox.py desktop.py rk_paths.py rk_sync.py RK_KANCELARIA_DESKTOP.pyw
          python TEST_TRUE_PORTABLE_PATHS.py
          python TEST_CASE_WORKSPACE.py
          python TEST_UI_PERFORMANCE_DEV4.py
          python TEST_CASE_RELATIONS_DOCUMENTS_DEV5.py
          python TEST_CLOSED_CASE_ACTIONS_DEV6.py
          python TEST_INBOX_REVIEW.py
          python RK_KANCELARIA_DESKTOP.pyw --self-test

      - name: Zbuduj prawdziwe EXE na Windows
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean RK_KANCELARIA_PORTABLE.spec

      - name: Dodaj znacznik Portable i katalog danych
        shell: pwsh
        run: |
          $out = "dist\RK KANCELARIA PORTABLE"
          if (!(Test-Path $out)) { throw "Brak katalogu wynikowego: $out" }
          New-Item -ItemType Directory -Force -Path "$out\Data" | Out-Null
          Set-Content -Path "$out\portable.flag" -Value "RK KANCELARIA PORTABLE" -Encoding ascii
          Copy-Item -Force README_TRUE_PORTABLE.txt "$out\README_TRUE_PORTABLE.txt"
          Copy-Item -Force SYNCHRONIZUJ.bat "$out\SYNCHRONIZUJ.bat"
          Copy-Item -Force SYNCHRONIZUJ.vbs "$out\SYNCHRONIZUJ.vbs"

      - name: Self-test gotowego EXE
        shell: pwsh
        run: |
          $exe = Resolve-Path "dist\RK KANCELARIA PORTABLE\RK KANCELARIA.exe"
          $p = Start-Process -FilePath $exe -ArgumentList "--self-test" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Self-test EXE zakonczyl sie kodem $($p.ExitCode)" }

      - name: Sprawdz strukture paczki
        shell: pwsh
        run: |
          $out = "dist\RK KANCELARIA PORTABLE"
          $must = @(
            "$out\RK KANCELARIA.exe",
            "$out\_internal",
            "$out\portable.flag",
            "$out\Data"
          )
          foreach ($p in $must) {
            if (!(Test-Path $p)) { throw "Brakuje: $p" }
          }
          Get-ChildItem $out | Format-Table Name, Length, Mode

      - name: Spakuj finalny Portable ZIP
        shell: pwsh
        run: |
          $zip = "RK_KANCELARIA_WINDOWS_PORTABLE.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path "dist\RK KANCELARIA PORTABLE\*" -DestinationPath $zip -CompressionLevel Optimal

      # Opcjonalny zapis app.py i README.md. Jest to funkcja wygody,
      # a nie warunek budowania nowej wersji programu.
      - name: Zapisz poprawione zrodla w repozytorium
        shell: pwsh
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py README.md
          $changed = git diff --cached --name-only
          if ($changed) {
            git commit -m "Integrate RK KANCELARIA inbox 0.3.1-dev1"
            if ($LASTEXITCODE -ne 0) { throw "Nie udało się utworzyć commita" }
            git push origin "HEAD:${{ github.ref_name }}"
            if ($LASTEXITCODE -ne 0) {
              Write-Warning "GitHub odmówił automatycznego zapisu app.py. Build będzie kontynuowany na zaktualizowanych źródłach w runnerze."
              exit 0
            }
          } else {
            Write-Host "Zrodla sa juz zaktualizowane; nie tworze nowego commita."
          }

      - name: Udostepnij gotowa paczke
        uses: actions/upload-artifact@v4
        with:
          name: RK-KANCELARIA-WINDOWS-PORTABLE
          path: RK_KANCELARIA_WINDOWS_PORTABLE.zip
          if-no-files-found: error
          retention-days: 30
