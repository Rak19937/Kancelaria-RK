name: "RK KANCELARIA - DEV7: stabilizacja podstaw i Windows Portable"

on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: rk-dev5-installation
  cancel-in-progress: false

env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: 'utf-8'
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  full-dev5-repair:
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - name: Pobierz źródła
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Python 3.13 64 bit
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: x64
          cache: pip

      - name: Zależności
        shell: pwsh
        run: |
          chcp 65001 > $null
          python -X utf8 -m pip install -r requirements.txt -r requirements_desktop.txt "pyinstaller>=6.10,<7"
          if ($LASTEXITCODE -ne 0) { throw 'Instalacja zależności nie powiodła się.' }

      - name: Sprawdź stan bazowej wersji DEV5
        shell: pwsh
        run: |
          $app = Get-Content app.py -Raw -Encoding utf8
          if (-not $app.Contains('VERSION = "0.4.0-dev5"')) {
            throw 'Ta aktualizacja wymaga RK KANCELARIA 0.4.0-dev5; instalacja zatrzymana bez zmian.'
          }
          python -X utf8 ZASTOSUJ_040_DEV5_PELNA.py . --verify
          if ($LASTEXITCODE -ne 0) { throw 'Weryfikacja poprzedniej aktualizacji DEV5 nie powiodła się.' }

      - name: Sprawdź pakiet UX6 bez zmiany źródeł
        shell: pwsh
        run: |
          foreach ($f in @('rk_ux6.py','ZASTOSUJ_UX6.py','TEST_RK_UX6.py','assets/rk_ux6.css','assets/rk_ux6.js')) {
            if (-not (Test-Path $f -PathType Leaf)) { throw "Brakuje wymaganego pliku UX6: $f" }
          }
          python -X utf8 -m py_compile rk_ux6.py ZASTOSUJ_UX6.py TEST_RK_UX6.py
          if ($LASTEXITCODE -ne 0) { throw 'Błąd składni UX6.' }
          python -X utf8 ZASTOSUJ_UX6.py . --dry-run
          if ($LASTEXITCODE -ne 0) { throw 'Niebezpieczna lub niezgodna modyfikacja źródeł.' }
          python -X utf8 TEST_RK_UX6.py
          if ($LASTEXITCODE -ne 0) { throw 'Testy izolowane UX6 nie przeszły.' }

      - name: Zastosuj UX6 do źródeł — nigdy do Data
        shell: pwsh
        run: |
          python -X utf8 ZASTOSUJ_UX6.py .
          if ($LASTEXITCODE -ne 0) { throw 'Instalator UX6 odmówił zastosowania zmian.' }
          python -X utf8 ZASTOSUJ_UX6.py . --verify
          if ($LASTEXITCODE -ne 0) { throw 'Weryfikacja UX6 po instalacji nie przeszła.' }
          python -X utf8 -m py_compile app.py rk_dev3.py rk_inbox.py rk_ux6.py
          if ($LASTEXITCODE -ne 0) { throw 'Błąd składni po integracji UX6.' }

      - name: DEV7 - sprawdz dopasowanie poprawki przed zapisem
        shell: pwsh
        run: |
          foreach ($f in @('ZASTOSUJ_DEV7.py','rk_dev7_stability.py','TEST_RK_DEV7.py')) {
            if (-not (Test-Path -LiteralPath $f -PathType Leaf)) { throw "Brakuje pliku DEV7: $f" }
          }
          python -X utf8 -m py_compile ZASTOSUJ_DEV7.py rk_dev7_stability.py TEST_RK_DEV7.py
          if ($LASTEXITCODE -ne 0) { throw 'Blad skladni w DEV7.' }
          python -X utf8 ZASTOSUJ_DEV7.py . --dry-run
          if ($LASTEXITCODE -ne 0) { throw 'DEV7: niezgodnosc kodu, nic nie zapisano.' }

      - name: DEV7 - zastosuj poprawki i uruchom testy bez danych klientow
        shell: pwsh
        run: |
          python -X utf8 ZASTOSUJ_DEV7.py .
          if ($LASTEXITCODE -ne 0) { throw 'DEV7: instalator przerwal wdrozenie.' }
          python -X utf8 ZASTOSUJ_DEV7.py . --verify
          if ($LASTEXITCODE -ne 0) { throw 'DEV7: kontrola zainstalowanych plikow nie przeszla.' }
          python -X utf8 TEST_RK_DEV7.py
          if ($LASTEXITCODE -ne 0) { throw 'DEV7: nowe testy regresji nie przeszly.' }
          python -X utf8 -m py_compile app.py rk_ux6.py
          if ($LASTEXITCODE -ne 0) { throw 'DEV7: bledy skladni po aktualizacji.' }

      - name: Testy UX6, DEV5 i bezpieczeństwa
        shell: pwsh
        run: |
          python -X utf8 TEST_RK_UX6.py
          if ($LASTEXITCODE -ne 0) { throw 'Nieprzechodzące testy UX6.' }
          python -X utf8 TEST_RK_DEV5.py
          if ($LASTEXITCODE -ne 0) { throw 'Nieprzechodzące testy DEV5.' }
          python -X utf8 TEST_RK_DEV5_SECURITY.py
          if ($LASTEXITCODE -ne 0) { throw 'Nieprzechodzące testy bezpieczeństwa.' }
          python -X utf8 TEST_RK_DEV5_CI.py
          if ($LASTEXITCODE -ne 0) { throw 'Nieprzechodzące testy workflow.' }

      - name: Pełna regresja i audyt statyczny
        shell: pwsh
        run: |
          python -X utf8 AUDYT_I_TESTY_RK_040_DEV2.py --root . --out RAPORT_AUDYT_040_DEV2.json
          if ($LASTEXITCODE -ne 0) { throw 'Wykryto regresję w testach historycznych.' }
          python -X utf8 RK_DEV5_AUDYT_REPO.py --root . --out RAPORT_DEV5_AUDYT_REPO.json
          if ($LASTEXITCODE -ne 0) { throw 'Wykryto krytyczne błędy w audycie źródeł.' }
          python -X utf8 RAPORT_JAKOSCI_040.py . --out RAPORT_JAKOSCI_040.json
          if ($LASTEXITCODE -ne 0) { throw 'Nie przechodzi raport jakości.' }
          python -X utf8 RK_KANCELARIA_DESKTOP.pyw --self-test
          if ($LASTEXITCODE -ne 0) { throw 'Nie przechodzi self-test Pythona.' }

      - name: Budowanie Windows Portable
        shell: pwsh
        run: |
          python -X utf8 -m PyInstaller --noconfirm --clean RK_KANCELARIA_PORTABLE.spec
          if ($LASTEXITCODE -ne 0) { throw 'PyInstaller nie zbudował programu.' }
          $out = 'dist/RK KANCELARIA PORTABLE'
          $exe = Join-Path $out 'RK KANCELARIA.exe'
          if (-not (Test-Path $exe)) { throw 'Nie znaleziono RK KANCELARIA.exe.' }
          New-Item -ItemType Directory -Force -Path "$out/Data" | Out-Null
          if ((Get-ChildItem "$out/Data" -Force | Measure-Object).Count -ne 0) {
            throw 'Błąd bezpieczeństwa: w paczce wynikowej są dane użytkowników.'
          }
          Set-Content "$out/portable.flag" 'RK KANCELARIA PORTABLE' -Encoding ascii
          foreach ($f in @('README_TRUE_PORTABLE.txt','LICENSE.txt','SYNCHRONIZUJ.bat','SYNCHRONIZUJ.vbs','SPRAWDZ_POCHODZENIE.py')) {
            if (-not (Test-Path $f)) { throw "Brak pliku $f" }
            Copy-Item -LiteralPath $f -Destination "$out/$f" -Force
          }

      - name: Test gotowego EXE i integralności
        shell: pwsh
        run: |
          $out = 'dist/RK KANCELARIA PORTABLE'
          $exe = (Resolve-Path "$out/RK KANCELARIA.exe").Path
          $p = Start-Process -FilePath $exe -ArgumentList '--self-test' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "EXE self-test zwrócił $($p.ExitCode)" }
          if ((Get-Item $exe).VersionInfo.ProductName -ne 'RK KANCELARIA') { throw 'Złe metadane EXE.' }
          $root = (Resolve-Path $out).Path
          $items = Get-ChildItem $root -Recurse -File | Where-Object {
            $_.FullName -notmatch '[\\/]Data[\\/]' -and $_.Name -ne 'SHA256SUMS.txt'
          } | Sort-Object FullName
          $lines = foreach ($item in $items) {
            $rel = [System.IO.Path]::GetRelativePath($root,$item.FullName).Replace('\','/')
            $hash = (Get-FileHash -Algorithm SHA256 $item.FullName).Hash.ToLowerInvariant()
            "$hash  $rel"
          }
          [System.IO.File]::WriteAllLines((Join-Path $root 'SHA256SUMS.txt'),[string[]]$lines,[System.Text.UTF8Encoding]::new($false))
          python -X utf8 SPRAWDZ_POCHODZENIE.py "$out"
          if ($LASTEXITCODE -ne 0) { throw 'Weryfikacja sum kontrolnych nie przeszła.' }

      - name: Utwórz gotowy ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path 'dist/RK KANCELARIA PORTABLE/*' -DestinationPath 'RK_KANCELARIA_DEV7_STABILITY_WINDOWS_PORTABLE.zip' -Force -CompressionLevel Optimal
          if (-not (Test-Path 'RK_KANCELARIA_DEV7_STABILITY_WINDOWS_PORTABLE.zip')) { throw 'Nie utworzono ZIP.' }

      - name: Publikacja wersji przetestowanej
        uses: actions/upload-artifact@v4
        with:
          name: RK-KANCELARIA-DEV7-STABILITY-PORTABLE
          path: RK_KANCELARIA_DEV7_STABILITY_WINDOWS_PORTABLE.zip
          if-no-files-found: error
          retention-days: 30

      - name: Zapisz na main tylko przetestowany kod (bez workflow i danych)
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- app.py rk_dev3.py rk_inbox.py rk_ux6.py
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 1) {
            git commit -m 'RK KANCELARIA DEV7: stabilizacja kasowania spraw, walidacja, kalendarz'
            if ($LASTEXITCODE -ne 0) { throw 'Nie udało się zatwierdzić kodu.' }
            git push origin HEAD:main
            if ($LASTEXITCODE -ne 0) { throw 'Nie udało się wysłać przetestowanych zmian; Portable jest już w artefaktach.' }
          } elseif ($LASTEXITCODE -ne 0) {
            throw 'Błąd git diff.'
          }

      - name: Raporty także w razie niepowodzenia
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RK-KANCELARIA-DEV7-TESTY
          path: |
            RAPORT_AUDYT_040_DEV2.json
            RAPORT_DEV5_AUDYT_REPO.json
            RAPORT_JAKOSCI_040.json
            CI_AUDYT_LOGI/*.log
          if-no-files-found: ignore
          retention-days: 30
