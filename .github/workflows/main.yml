name: Build RK KANCELARIA Windows Portable

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: write

env:
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: '1'

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4

      - name: Python 3.13 x64
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: 'x64'
          cache: 'pip'

      - name: Aktualizuj pip
        shell: pwsh
        run: python -m pip install --upgrade pip wheel setuptools

      - name: Zainstaluj zaleznosci RK KANCELARIA
        shell: pwsh
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -r requirements_desktop.txt
          python -m pip install "pyinstaller>=6.10,<7"

      - name: Integracja zgodnych modułów 0.3.2 / 0.3.3
        shell: pwsh
        run: |
          if (Select-String -Path app.py -SimpleMatch 'VERSION = "0.3.4-dev1"' -Quiet) {
            Write-Host "Źródła 0.3.4 są już kompletne — pomijam historyczne integratory."
          } else {
            python RK_AKTUALIZACJA_ZBIORCZA.py .
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            python ZASTOSUJ_PODGLAD.py .
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Zintegruj Centrum decyzji 0.3.4-dev1
        shell: pwsh
        run: |
          python ZASTOSUJ_OBIEG.py .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test zrodel przed buildem
        shell: pwsh
        run: |
          python -m py_compile app.py rk_inbox.py rk_document_hub.py rk_unified_preview.py rk_action_center.py ZASTOSUJ_PODGLAD.py ZASTOSUJ_OBIEG.py RK_STABILIZACJA.py RK_AKTUALIZACJA_ZBIORCZA.py RK_WYCZYSC_PODPOWIEDZI.py desktop.py rk_paths.py rk_sync.py RK_KANCELARIA_DESKTOP.pyw
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python TEST_TRUE_PORTABLE_PATHS.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python TEST_CASE_WORKSPACE.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python TEST_UI_PERFORMANCE_DEV4.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python TEST_CASE_RELATIONS_DOCUMENTS_DEV5.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python TEST_CLOSED_CASE_ACTIONS_DEV6.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python TEST_INBOX_REVIEW.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python TEST_STABILIZACJA.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python TEST_DOCUMENT_HUB.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python TEST_AKTUALIZACJA_ZBIORCZA.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python TEST_UNIFIED_PREVIEW.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python TEST_ACTION_CENTER.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python RK_KANCELARIA_DESKTOP.pyw --self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Po przejściu testów zapisuje aktualne źródła w main.
      - name: Zapisz przetestowane i oczyszczone źródła na main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py rk_inbox.py README.md
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "RK KANCELARIA 0.3.4-dev1: human-reviewed legal workflow"
            if ($LASTEXITCODE -ne 0) { throw "Nie udało się zapisać commita" }
            git push origin HEAD:main
            if ($LASTEXITCODE -ne 0) { throw "GitHub zablokował zapis źródeł; build jest kontynuowany" }
          } else {
            Write-Host "Źródła już są zaktualizowane."
          }

      - name: Zbuduj prawdziwe EXE na Windows
        shell: pwsh
        run: python -m PyInstaller --noconfirm --clean RK_KANCELARIA_PORTABLE.spec

      - name: Dodaj znacznik Portable i katalog danych
        shell: pwsh
        run: |
          $out = "dist\RK KANCELARIA PORTABLE"
          if (!(Test-Path $out)) { throw "Brak katalogu wynikowego: $out" }
          New-Item -ItemType Directory -Force -Path "$out\Data" | Out-Null
          Set-Content -Path "$out\portable.flag" -Value "RK KANCELARIA PORTABLE" -Encoding ascii
          Copy-Item -Force README_TRUE_PORTABLE.txt "$out\README_TRUE_PORTABLE.txt"
          Copy-Item -Force LICENSE.txt "$out\LICENSE.txt"
          Copy-Item -Force SYNCHRONIZUJ.bat "$out\SYNCHRONIZUJ.bat"
          Copy-Item -Force SYNCHRONIZUJ.vbs "$out\SYNCHRONIZUJ.vbs"

      - name: Self-test gotowego EXE
        shell: pwsh
        run: |
          $exe = Resolve-Path "dist\RK KANCELARIA PORTABLE\RK KANCELARIA.exe"
          $p = Start-Process -FilePath $exe -ArgumentList "--self-test" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Self-test EXE zakonczyl sie kodem $($p.ExitCode)" }

      - name: Sprawdz strukture paczki
        shell: pwsh
        run: |
          $out = "dist\RK KANCELARIA PORTABLE"
          $must = @(
            "$out\RK KANCELARIA.exe",
            "$out\_internal",
            "$out\portable.flag",
            "$out\Data",
            "$out\LICENSE.txt"
          )
          foreach ($p in $must) {
            if (!(Test-Path $p)) { throw "Brakuje: $p" }
          }
          Get-ChildItem $out | Format-Table Name, Length, Mode

      - name: Spakuj finalny Portable ZIP
        shell: pwsh
        run: |
          $zip = "RK_KANCELARIA_WINDOWS_PORTABLE.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path "dist\RK KANCELARIA PORTABLE\*" -DestinationPath $zip -CompressionLevel Optimal

      - name: Udostepnij gotowa paczke
        uses: actions/upload-artifact@v4
        with:
          name: RK-KANCELARIA-WINDOWS-PORTABLE
          path: RK_KANCELARIA_WINDOWS_PORTABLE.zip
          if-no-files-found: error
          retention-days: 30
