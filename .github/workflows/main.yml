name: Build RK KANCELARIA Windows Portable

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: write

env:
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: '1'

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4

      - name: Python 3.13 x64
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: 'x64'
          cache: pip

      - name: Aktualizuj pip
        shell: pwsh
        run: python -m pip install --upgrade pip wheel setuptools

      - name: Zainstaluj zaleznosci RK KANCELARIA
        shell: pwsh
        run: |
          python -m pip install -r requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install -r requirements_desktop.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install "pyinstaller>=6.10,<7"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # RK_0310_WORKFLOW — sprawdź i zastosuj jedną aktualizację 0.3.10.
      # Na kolejnym uruchomieniu instalator rozpoznaje wersję 0.3.10 i niczego nie dubluje.
      - name: Aktywuj RK KANCELARIA 0.3.10 - UX i architektura
        shell: pwsh
        run: |
          python ZASTOSUJ_AKTUALIZACJE.py . --dry-run
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python ZASTOSUJ_AKTUALIZACJE.py .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Select-String -Path app.py -SimpleMatch 'VERSION = "0.3.10-dev1"' -Quiet)) {
            throw 'Kompilacja zatrzymana: źródła nie zawierają wersji 0.3.10-dev1.'
          }

      - name: Popraw widoczność odczytu w skrzynce wpływu
        shell: pwsh
        run: |
          python ZASTOSUJ_SKRZYNKA_FIX.py . --dry-run
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python ZASTOSUJ_SKRZYNKA_FIX.py .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Testy zrodel przed buildem
        shell: pwsh
        run: |
          $modules = @(
            'app.py','rk_inbox.py','rk_document_hub.py','rk_unified_preview.py',
            'rk_action_center.py','rk_correspondence.py','rk_record_navigation.py',
            'rk_workspace_plus.py','rk_case_categories.py','rk_caseflow.py',
            'rk_ux.py','rk_navigation.py','rk_routes.py','rk_dashboard_data.py',
            'rk_search_data.py','rk_document_data.py','ZASTOSUJ_AKTUALIZACJE.py',
            'ZASTOSUJ_SKRZYNKA_FIX.py',
            'ZASTOSUJ_CASEFLOW.py','ZASTOSUJ_WORKSPACE_PLUS.py',
            'ZASTOSUJ_KATEGORIE.py','ZASTOSUJ_NAWIGACJE.py',
            'ZASTOSUJ_PODGLAD.py','ZASTOSUJ_OBIEG.py','ZASTOSUJ_KORESPONDENCJE.py',
            'RK_STABILIZACJA.py','RK_AKTUALIZACJA_ZBIORCZA.py',
            'RK_WYCZYSC_PODPOWIEDZI.py','desktop.py','rk_paths.py','rk_sync.py',
            'RK_KANCELARIA_DESKTOP.pyw'
          )
          python -m py_compile @modules
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $tests = @(
            'TEST_TRUE_PORTABLE_PATHS.py',
            'TEST_CASE_WORKSPACE.py',
            'TEST_UI_PERFORMANCE_DEV4.py',
            'TEST_CASE_RELATIONS_DOCUMENTS_DEV5.py',
            'TEST_CLOSED_CASE_ACTIONS_DEV6.py',
            'TEST_INBOX_REVIEW.py',
            'TEST_INBOX_FIX_0310.py',
            'TEST_STABILIZACJA.py',
            'TEST_DOCUMENT_HUB.py',
            'TEST_AKTUALIZACJA_ZBIORCZA.py',
            'TEST_UNIFIED_PREVIEW.py',
            'TEST_ACTION_CENTER.py',
            'TEST_KORESPONDENCJE.py',
            'TEST_NAWIGACJA.py',
            'TEST_INTEGRACJA_NAWIGACJI.py',
            'TEST_WORKSPACE_PLUS.py',
            'TEST_CASE_CATEGORIES.py',
            'TEST_INTEGRACJA_KATEGORII.py',
            'TEST_CASEFLOW.py',
            'TEST_INTEGRACJA_CASEFLOW.py',
            'TEST_UX_039.py',
            'TEST_ARCHITEKTURA_0310.py',
            'TEST_INTEGRACJA_PACZKI_0310.py'
          )
          foreach ($test in $tests) {
            Write-Host "TEST: $test"
            python $test
            if ($LASTEXITCODE -ne 0) { throw "Test nie przeszedł: $test" }
          }
          python RK_KANCELARIA_DESKTOP.pyw --self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Commitujemy wyłącznie pliki zmienione przez instalator. Nie dotykamy Data.
      - name: Zapisz przetestowane źródła 0.3.10 na main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- app.py rk_caseflow.py assets/rk_app.js rk_inbox.py rk_ux.py assets/rk_ux.js TEST_STABILIZACJA.py TEST_AKTUALIZACJA_ZBIORCZA.py TEST_UI_PERFORMANCE_DEV4.py
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 1) {
            git commit -m "RK KANCELARIA 0.3.10-dev1: UX and architecture"
            if ($LASTEXITCODE -ne 0) { throw 'Nie udało się zapisać źródeł 0.3.10.' }
            git push origin HEAD:main
            if ($LASTEXITCODE -ne 0) { throw 'Nie udało się wysłać źródeł 0.3.10 na main.' }
          } elseif ($LASTEXITCODE -eq 0) {
            Write-Host 'Źródła 0.3.10 są już zapisane.'
          } else {
            throw 'Nie udało się porównać zmian.'
          }

      - name: Zbuduj prawdziwe EXE na Windows
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean RK_KANCELARIA_PORTABLE.spec
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Dodaj znacznik Portable i katalog danych
        shell: pwsh
        run: |
          $out = "dist\RK KANCELARIA PORTABLE"
          if (!(Test-Path $out)) { throw "Brak katalogu wynikowego: $out" }
          New-Item -ItemType Directory -Force -Path "$out\Data" | Out-Null
          Set-Content -Path "$out\portable.flag" -Value "RK KANCELARIA PORTABLE" -Encoding ascii
          Copy-Item -Force README_TRUE_PORTABLE.txt "$out\README_TRUE_PORTABLE.txt"
          Copy-Item -Force LICENSE.txt "$out\LICENSE.txt"
          Copy-Item -Force SYNCHRONIZUJ.bat "$out\SYNCHRONIZUJ.bat"
          Copy-Item -Force SYNCHRONIZUJ.vbs "$out\SYNCHRONIZUJ.vbs"

      - name: Self-test gotowego EXE
        shell: pwsh
        run: |
          $exe = Resolve-Path "dist\RK KANCELARIA PORTABLE\RK KANCELARIA.exe"
          $p = Start-Process -FilePath $exe -ArgumentList "--self-test" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Self-test EXE zakonczyl sie kodem $($p.ExitCode)" }

      - name: Sprawdz strukture paczki
        shell: pwsh
        run: |
          $out = "dist\RK KANCELARIA PORTABLE"
          $must = @(
            "$out\RK KANCELARIA.exe",
            "$out\_internal",
            "$out\portable.flag",
            "$out\Data",
            "$out\LICENSE.txt"
          )
          foreach ($p in $must) {
            if (!(Test-Path $p)) { throw "Brakuje: $p" }
          }
          Get-ChildItem $out | Format-Table Name, Length, Mode

      - name: Spakuj finalny Portable ZIP
        shell: pwsh
        run: |
          $zip = "RK_KANCELARIA_WINDOWS_PORTABLE.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path "dist\RK KANCELARIA PORTABLE\*" -DestinationPath $zip -CompressionLevel Optimal

      - name: Udostepnij gotowa paczke
        uses: actions/upload-artifact@v4
        with:
          name: RK-KANCELARIA-WINDOWS-PORTABLE
          path: RK_KANCELARIA_WINDOWS_PORTABLE.zip
          if-no-files-found: error
          retention-days: 30
