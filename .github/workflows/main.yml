name: Build RK KANCELARIA Windows Portable

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: rk-kancelaria-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: '1'

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4

      - name: Python 3.13 x64
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: 'x64'
          cache: pip

      - name: Aktualizuj pip
        shell: pwsh
        run: python -m pip install --upgrade pip wheel setuptools

      - name: Zainstaluj zaleznosci RK KANCELARIA
        shell: pwsh
        run: |
          python -m pip install -r requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install -r requirements_desktop.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install "pyinstaller>=6.10,<7"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # RK KANCELARIA 0.4: jedno przejście A+B+C. Dane klienta nie są częścią CI.
      - name: Zastosuj RK 0.4.0-dev1 — modularyzacja A+B+C
        shell: pwsh
        run: |
          if (Select-String -Path app.py -SimpleMatch 'VERSION = "0.4.0-dev2"' -Quiet) {
            Write-Host '0.4.0-dev2 już aktywna. Pomijam migrator 0.4.0-dev1.'
          } else {
            python ZASTOSUJ_040.py . --dry-run
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            python ZASTOSUJ_040.py .
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            if (!(Select-String -Path app.py -SimpleMatch 'VERSION = "0.4.0-dev1"' -Quiet)) {
              throw 'Źródła nie zawierają wymaganej wersji 0.4.0-dev1.'
            }
          }

      - name: Zastosuj RK 0.4.0-dev2 — stabilizacja i bezpieczeństwo
        shell: pwsh
        run: |
          python ZASTOSUJ_040_DEV2.py . --dry-run
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python ZASTOSUJ_040_DEV2.py .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Select-String -Path app.py -SimpleMatch 'VERSION = "0.4.0-dev2"' -Quiet)) {
            throw 'Źródła nie zawierają wersji 0.4.0-dev2.'
          }

      - name: Zastosuj zbiorczy patch po migracji dev2
        shell: pwsh
        run: |
          python PATCH_RK_040_DEV2_ALL.py . --dry-run
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python PATCH_RK_040_DEV2_ALL.py .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python PATCH_RK_040_DEV2_ALL.py . --verify
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Analiza całego kodu i wszystkie testy (raport zbiorczy)
        shell: pwsh
        run: |
          python AUDYT_I_TESTY_RK_040_DEV2.py --root . --out RAPORT_AUDYT_040_DEV2.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python RK_KANCELARIA_DESKTOP.pyw --self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python RAPORT_JAKOSCI_040.py . --out RAPORT_JAKOSCI_040.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Zbuduj prawdziwe EXE na Windows
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean RK_KANCELARIA_PORTABLE.spec
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Dodaj znacznik Portable i katalog danych
        shell: pwsh
        run: |
          $out = "dist\RK KANCELARIA PORTABLE"
          if (!(Test-Path $out)) { throw "Brak katalogu wynikowego: $out" }
          New-Item -ItemType Directory -Force -Path "$out\Data" | Out-Null
          Set-Content -Path "$out\portable.flag" -Value "RK KANCELARIA PORTABLE" -Encoding ascii
          Copy-Item -Force README_TRUE_PORTABLE.txt "$out\README_TRUE_PORTABLE.txt"
          Copy-Item -Force LICENSE.txt "$out\LICENSE.txt"
          Copy-Item -Force SYNCHRONIZUJ.bat "$out\SYNCHRONIZUJ.bat"
          Copy-Item -Force SYNCHRONIZUJ.vbs "$out\SYNCHRONIZUJ.vbs"

      - name: Self-test gotowego EXE
        shell: pwsh
        run: |
          $exe = Resolve-Path "dist\RK KANCELARIA PORTABLE\RK KANCELARIA.exe"
          $p = Start-Process -FilePath $exe -ArgumentList "--self-test" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Self-test EXE zakonczyl sie kodem $($p.ExitCode)" }

      - name: Sprawdz strukture paczki
        shell: pwsh
        run: |
          $out = "dist\RK KANCELARIA PORTABLE"
          $must = @(
            "$out\RK KANCELARIA.exe",
            "$out\_internal",
            "$out\portable.flag",
            "$out\Data",
            "$out\LICENSE.txt"
          )
          foreach ($p in $must) {
            if (!(Test-Path $p)) { throw "Brakuje: $p" }
          }
          Get-ChildItem $out | Format-Table Name, Length, Mode

      # Commitujemy wyłącznie pliki zmienione przez instalator. Nie dotykamy Data.
      - name: Zapisz przetestowane źródła 0.4.0-dev2 na main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- app.py rk_inbox.py rk_sync.py rk_cloud.py rk_cloud_server.py rk_workspace_plus.py rk_correspondence.py rk_document_hub.py rk_core rk_domains assets/service-worker.js assets/rk_csrf.js TEST_ARCHITEKTURA_040.py RAPORT_JAKOSCI_040.py ODZYSKAJ_SYNCHRONIZACJE_040.py
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 1) {
            git commit -m "RK KANCELARIA 0.4.0-dev2: hardening, async OCR, sync recovery"
            if ($LASTEXITCODE -ne 0) { throw 'Nie udało się zapisać źródeł 0.4.0.' }
            git push origin HEAD:main
            if ($LASTEXITCODE -ne 0) { throw 'Nie udało się wysłać źródeł 0.4.0 na main.' }
          } elseif ($LASTEXITCODE -eq 0) {
            Write-Host 'Źródła 0.4.0-dev2 są już zapisane.'
          } else {
            throw 'Nie udało się porównać zmian.'
          }

      - name: Spakuj finalny Portable ZIP
        shell: pwsh
        run: |
          $zip = "RK_KANCELARIA_WINDOWS_PORTABLE.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path "dist\RK KANCELARIA PORTABLE\*" -DestinationPath $zip -CompressionLevel Optimal

      - name: Udostepnij gotowa paczke
        uses: actions/upload-artifact@v4
        with:
          name: RK-KANCELARIA-WINDOWS-PORTABLE
          path: RK_KANCELARIA_WINDOWS_PORTABLE.zip
          if-no-files-found: error
          retention-days: 30

      - name: Udostępnij audyt i logi wszystkich testów
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RK-KANCELARIA-RAPORT-TESTY-040-DEV2
          path: |
            RAPORT_AUDYT_040_DEV2.json
            CI_AUDYT_LOGI/*.log
            RAPORT_JAKOSCI_040.json
          if-no-files-found: warn
          retention-days: 30

      - name: Udostepnij raport jakosci kodu 0.4
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RK-KANCELARIA-RAPORT-ARCHITEKTURY-040
          path: RAPORT_JAKOSCI_040.json
          if-no-files-found: ignore
          retention-days: 30
