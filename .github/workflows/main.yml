# Glowny build jest w aktualizacja-dev5.yml. Ten workflow jest reczny,
# aby nie uruchamiac starego dev4 obok nowego dev5 na kazdym push.
# Testy wykonywane przez wywolany workflow:
# python TEST_RK_DEV5.py
# python TEST_RK_DEV5_SECURITY.py
name: RK KANCELARIA - reczna kontrola Portable (DEV5)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  portable:
    uses: ./.github/workflows/aktualizacja-dev5.yml
    permissions:
      contents: write
